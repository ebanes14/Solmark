<script>
const $=s=>document.querySelector(s),esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date()),fd=d=>d?d.split("-").reverse().join("/"):"-";
const dys=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const addD=(a,n)=>{const d=new Date(a+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
const money=n=>"$"+Math.round(n).toLocaleString("es-AR"),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const EC={name:"ECDSA",namedCurve:"P-256"},sm=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const ROLES=["Administrador","Socio","Supervisor","Vendedor","Cliente","Soporte"],PROGS=["Barbería","Gimnasio"],MODS=[["res","🏠 Resumen"],["cli","👥 Clientes"],["pag","💰 Pagos"],["ven","🧑‍💼 Vendedores"],["pre","🏷 Precios"],["apl","📱 Aplicaciones"],["tic","🎫 Tickets"],["age","📅 Agenda"],["cla","🔑 Claves"],["usr","🔐 Usuarios"],["aju","⚙️ Ajustes"]];
const defPerm=()=>({Socio:["res","cli","pag"],Supervisor:["res","cli","ven","tic","age"],Vendedor:["res","cli","age"],Cliente:[],Soporte:["cli","tic"]});
const MES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const APN=()=>D.apps.map(a=>a.name),priceFor=(m,pg)=>{const a=D.apps.find(x=>x.name===pg),v=a&&a.prices?+a.prices[m]:0;return v>0?v:price(m)},go=k=>{tab=k;cid=null;aid=null;MO=false;draw()};
let aid=null,MO=false,CY=new Date().getFullYear(),CM=new Date().getMonth(),CD=null,U=null,ST="load",FIRST=false,KE=null,OLD=null,OLDH=[],VM=localStorage.getItem("gen_view")||"";
const VW=()=>VM||(innerWidth>=800?"pc":"mv"),me=()=>{const u=D.users.find(x=>x.id===U);return u&&u.active!==false?u:null},isAdm=()=>{const u=me();return !!u&&u.roles.includes("Administrador")};
const mods=()=>{const u=me();if(!u)return[];if(isAdm())return MODS.map(m=>m[0]);return[...new Set(u.roles.flatMap(r=>D.perm[r]||[]))].filter(k=>k!=="usr"&&k!=="cla").concat("aju")};
const un=id=>(D.users.find(u=>u.id===id)||{}).name||"-",tn=n=>"#"+String(n).padStart(4,"0"),SL=()=>D.users.filter(u=>u.roles.includes("Vendedor")&&u.active!==false);
const prg=(c,n)=>c.progs.find(p=>p.prog===n),IC={Llamada:"📞",Visita:"🚗",Nota:"📝",Pago:"💰",Ticket:"🎫",Clave:"🔑",Asignación:"👤",Agenda:"📅"},ic=t=>IC[t]||"✅";
const L=(c,t,n,by)=>D.log.unshift({id:uid(),clientId:c,date:today(),ts:Date.now(),type:t,note:n,by:by||U});
const lastC=id=>D.log.filter(l=>l.clientId===id&&(l.type==="Llamada"||l.type==="Visita")).sort((a,b)=>b.date.localeCompare(a.date))[0];
async function hp(p,s){return b64u(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s+p)))}
function mig(){D.users=D.users||[];D.apps=D.apps||[];D.reqs=D.reqs||[];D.log=D.log||[];D.tn=D.tn||0;D.perm=D.perm||defPerm();
 if(!D.mig){(D.sellers||[]).forEach(s=>{if(!D.users.some(u=>u.id===s.id))D.users.push({id:s.id,name:s.name,email:"",phone:s.phone,notes:s.notes,roles:["Vendedor"],active:true})});D.mig=1}H.forEach(h=>{if(!h.hid)h.hid=uid()});
 D.clients.forEach(c=>{if(!c.progs)c.progs=[{prog:"Barbería",code:c.code||"",until:c.until||""}]});
 D.pay.forEach(p=>{if(!p.prog)p.prog="Barbería"});D.tickets.forEach(t=>{if(!t.num)t.num=++D.tn})}
addEventListener("resize",()=>{if(!VM&&me())document.body.className=VW()});
let K=null,H=[],D,tab="res",cid=null,mo=today().slice(0,7),tf="open",lastTok="";
const DEF=()=>({apps:[],reqs:[],users:[],log:[],tn:0,clients:[],sellers:[],pay:[],tickets:[],agenda:[],paid:{},lastBackup:"",cfg:{base:0,disc:{1:0,3:0,6:0,12:0},r1:100,r2:50}});
try{K=JSON.parse(localStorage.getItem("gen_keys"));OLD=JSON.parse(localStorage.getItem("gen_data"));OLDH=JSON.parse(localStorage.getItem("gen_hist"))||[]}catch(e){}
D=DEF();mig();
function persist(){if(window.FB)FB.save()}
const cli=id=>D.clients.find(c=>c.id===id),sel=id=>D.users.find(s=>s.id===id),cn=id=>cli(id)?cli(id).name+(cli(id).biz?" · "+cli(id).biz:""):"(eliminado)",sn=id=>sel(id)?sel(id).name:"Sin vendedor";
const PLAN={1:"Mensual",3:"Trimestral",6:"Semestral",12:"Anual"},price=m=>Math.round(D.cfg.base*m*(1-(D.cfg.disc[m]||0)/100));
const comm=p=>{const x=p.amount/p.months;let c=0;for(let i=1;i<=p.months;i++)c+=x*(p.n0+i===1?p.r1:p.r2)/100;return c};
const cst=c=>{const l=c.progs.filter(p=>p.until).sort((a,b)=>a.until.localeCompare(b.until));return st(l[0]||{})},st=c=>{if(!c.until)return{t:"Sin licencia",k:"m",d:null};const d=dys(today(),c.until);return d<0?{t:"Vencido hace "+(-d)+" d",k:"r",d}:d==0?{t:"Vence hoy",k:"r",d}:{t:"Vence en "+d+" d",k:d<=7?"o":"g",d}};
const chip=(t,k)=>`<span class="chip ch-${k}">${esc(t)}</span>`;
const wa=(c,msg,lbl)=>{const n=String(c.phone||"").replace(/\D/g,"");return n?`<a class="btn s" target="_blank" href="https://wa.me/${n}?text=${encodeURIComponent(msg)}">${lbl||"WhatsApp"}</a>`:""};
const copy=t=>navigator.clipboard.writeText(t).then(()=>alert("Copiado"));
function form(title,fields,ok){const h=document.createElement("div");h.className="sh";
 h.innerHTML=`<div><div class="row"><b>${title}</b><button class="s" id="x">Cerrar</button></div>`+fields.map(f=>`<label class="m">${f.l}</label>`+(f.o?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}"${String(o[0])===String(f.v)?" selected":""}>${esc(o[1])}</option>`).join("")}</select>`:f.a?`<textarea id="f_${f.k}">${esc(f.v)}</textarea>`:`<input id="f_${f.k}" type="${f.t||"text"}" value="${esc(f.v)}">`)).join("")+`<button id="ok" style="margin-top:8px">Guardar</button></div>`;
 document.body.appendChild(h);h.onclick=e=>{if(e.target===h)h.remove()};h.querySelector("#x").onclick=()=>h.remove();
 fields.forEach(f=>{if(f.c)h.querySelector("#f_"+f.k).onchange=e=>f.c(e.target.value,(k,x)=>{h.querySelector("#f_"+k).value=x})});
 h.querySelector("#ok").onclick=async()=>{const v={};fields.forEach(f=>v[f.k]=h.querySelector("#f_"+f.k).value.trim());const r=await ok(v);if(r!==false){h.remove();persist();draw()}}}
function modal(html){const h=document.createElement("div");h.className="sh";h.innerHTML="<div>"+html+"</div>";document.body.appendChild(h);h.onclick=e=>{if(e.target===h)h.remove()};return h}
// ---------- claves
async function signTok(code,until){const u=until.replace(/-/g,""),key=await crypto.subtle.importKey("jwk",K.priv,EC,false,["sign"]),sig=await crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"},key,new TextEncoder().encode(code+"."+u));return code+"."+u+"."+b64u(sig)}
function showKey(c,tok,nu){const msg=`Hola ${c.name}! Recibimos tu pago. Tu clave de activación (válida hasta el ${fd(nu)}) es:\n\n${tok}\n\nPegala en la app: Datos > Ingresar clave de renovación.`;
 const h=modal(`<b>Clave generada</b><p class="m">${esc(c.name)} · válida hasta ${fd(nu)}</p><textarea readonly>${esc(tok)}</textarea><button id="k1">Copiar clave</button><button class="s" id="k2">Copiar mensaje</button>${wa(c,msg,"Enviar por WhatsApp")}<button class="s" id="k3">Cerrar</button>`);
 h.querySelector("#k1").onclick=()=>copy(tok);h.querySelector("#k2").onclick=()=>copy(msg);h.querySelector("#k3").onclick=()=>h.remove()}
async function regen(id,pg){const c=cli(id),p=c&&prg(c,pg);if(!p)return;if(!K){alert("Las claves las genera el administrador: desbloquealas en la pestaña Claves");return}if(!p.code){alert("Cargá el código de cliente (Editar)");return}if(!p.until||p.until<today()){alert("La licencia está vencida o sin cargar: registrá un pago para generar una clave nueva");return}L(id,"Clave","Clave generada · "+pg+" · hasta "+fd(p.until));persist();showKey(c,await signTok(p.code,p.until),p.until)}
const P=()=>(K||KE).pub,ub=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function kdf(pw,salt){const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
function askPw(rp){const a=prompt("Elegí una frase secreta de al menos 8 caracteres. Si la olvidás NO se puede recuperar:");if(!a)return null;if(a.length<8){alert("Mínimo 8 caracteres");return null}if(rp&&prompt("Repetí la frase secreta:")!==a){alert("No coinciden");return null}return a}
async function protect(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await kdf(pw,salt),new TextEncoder().encode(JSON.stringify(K)));KE={salt:b64u(salt),iv:b64u(iv),ct:b64u(ct),pub:K.pub};await FB.putKeys(KE);localStorage.removeItem("gen_keys");alert("Listo: tus claves quedaron cifradas en la nube");draw()}
async function crear(){if((K||KE)&&!confirm("Ya tenés claves. Si creás nuevas, TODAS las claves anteriores dejan de servir y tenés que actualizar la app. ¿Seguro?"))return;const pw=askPw(true);if(!pw)return;
 const p=await crypto.subtle.generateKey(EC,true,["sign","verify"]);K={priv:await crypto.subtle.exportKey("jwk",p.privateKey),pub:await crypto.subtle.exportKey("jwk",p.publicKey)};await protect(pw)}
async function protegerKey(){const pw=askPw(true);if(pw)await protect(pw)}
async function abrir(){const pw=prompt("Frase secreta:");if(!pw)return;try{const r=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(KE.iv)},await kdf(pw,ub(KE.salt)),ub(KE.ct));K=JSON.parse(new TextDecoder().decode(r));draw()}catch(e){alert("Frase incorrecta")}}
function importLocal(){if(!OLD||!confirm("Vas a copiar a la nube los datos del panel anterior guardados en este dispositivo. ¿Seguir?"))return;
 const add=(a,b)=>(b||[]).forEach(x=>{if(!a.some(y=>y.id===x.id))a.push(x)});["clients","pay","tickets","agenda"].forEach(k=>add(D[k],OLD[k]));
 D.sellers=OLD.sellers||[];D.mig=0;if(OLD.cfg)D.cfg=Object.assign(D.cfg,OLD.cfg);D.paid=Object.assign({},OLD.paid,D.paid);
 OLDH.forEach(h=>{if(!H.some(y=>y.tok===h.tok))H.push(h)});mig();persist();draw();alert("Datos importados")}
const relink=(a,b)=>{D.clients.forEach(c=>{if(c.sellerId===a)c.sellerId=b});D.pay.forEach(p=>{if(p.sellerId===a)p.sellerId=b});D.agenda.forEach(x=>{if(x.userId===a)x.userId=b});D.tickets.forEach(x=>{if(x.userId===a)x.userId=b});D.log.forEach(l=>{if(l.by===a)l.by=b})};
const vNoAcc=()=>'<div class="c" style="max-width:380px;margin:40px auto;text-align:center"><h1>Solmark</h1><p>Tu cuenta todavía no tiene permisos. Pedile al administrador que te dé de alta.</p><button onclick="logout()">Salir</button></div>';
const pubLine=()=>"window.PUB_KEY="+JSON.stringify({kty:P().kty,crv:P().crv,x:P().x,y:P().y})+";";
function dlFile(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
const bajarClave=()=>dlFile("clave.js",pubLine(),"text/javascript");
function backup(){D.lastBackup=today();persist();dlFile("COPIA-ADMIN-"+today()+".json",JSON.stringify({version:3,keys:KE||K,data:D,hist:H}),"application/json");draw()}
function loadBackup(txt){try{const x=JSON.parse(txt);if(!(x.data&&(x.version===2||x.version===3)))throw 0;if(!confirm("Se van a reemplazar clientes, pagos, tickets, agenda e historial de la nube por los de esta copia. ¿Seguir?"))return;
 const cu=D.users.slice(),cp=D.perm;D=Object.assign(DEF(),x.data);D.users=cu;D.perm=cp;H=x.hist||H;if(x.keys){if(x.keys.ct){KE=x.keys;FB.putKeys(KE)}else K=x.keys}mig();persist();draw();alert("Copia restaurada")}catch(e){alert("Copia inválida")}}
const restoreFile=i=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>loadBackup(r.result);r.readAsText(f)};
async function gen(){if(!K){alert("Desbloqueá tus claves en esta pestaña (frase secreta)");return}const id=$("#id").value.trim().toUpperCase(),dias=parseInt($("#dias").value)||30,n=$("#nom").value.trim();if(!id){alert("Pegá el código del cliente");return}
 const nu=addD(today(),dias);lastTok=await signTok(id,nu);H.unshift({hid:uid(),n,id,u:nu.replace(/-/g,""),tok:lastTok,f:today()});H=H.slice(0,200);persist();draw()}
const rest=u=>{const n=dys(today(),u.slice(0,4)+"-"+u.slice(4,6)+"-"+u.slice(6,8));return n>0?"vence en "+n+" día"+(n==1?"":"s"):n==0?"vence hoy":"venció hace "+(-n)+" día"+(n==-1?"":"s")};
// ---------- clientes / vendedores
const PROV=["Buenos Aires","Ciudad Autónoma de Buenos Aires","Catamarca","Chaco","Chubut","Córdoba","Corrientes","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Misiones","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego","Tucumán"];
function clientForm(id){if(!APN().length){alert("Primero dá de alta una aplicación en el módulo Aplicaciones");return}const c=cli(id)||{},pr=n=>(c.progs||[]).find(p=>p.prog===n);
 const h=modal(`<b>${id?"Editar":"Nuevo"} cliente</b><label class="m">Nombre y apellido del cliente *</label><input id="cn_" value="${esc(c.name)}"><label class="m">Nombre del negocio</label><input id="cb_" value="${esc(c.biz)}"><label class="m">Documento (DNI o CUIT, solo números) *</label><input id="cd_" inputmode="numeric" value="${esc(c.doc)}"><label class="m">Teléfono con código de país (ej: 5493442123456)</label><input id="cp_" value="${esc(c.phone)}"><label class="m">Dirección</label><input id="ca_" value="${esc(c.addr)}"><label class="m">Ciudad</label><input id="cc_" value="${esc(c.city)}"><label class="m">Provincia</label><input id="cv_" list="provs" value="${esc(c.prov)}"><datalist id="provs">${PROV.map(p=>`<option value="${p}">`).join("")}</datalist><label class="m">Aplicaciones contratadas (una o más) *</label>`+APN().map((n,i)=>`<div class="c" style="margin:6px 0"><label style="display:block"><input type="checkbox" style="width:auto;margin:0 8px 0 0" data-i="${i}"${pr(n)?" checked":""}><b>${n}</b></label><input id="cx${i}" placeholder="Clave / código de cliente de ${n}" value="${esc(pr(n)?pr(n).code:"")}" style="${pr(n)?"":"display:none"}"></div>`).join("")+`<label class="m">Vendedor</label><select id="cs_"><option value="">Sin vendedor</option>${SL().map(v=>`<option value="${v.id}"${c.sellerId===v.id?" selected":""}>${esc(v.name)}</option>`).join("")}</select><label class="m">Estado</label><select id="ce_"><option value="1">Activo</option><option value="0"${c.active==="0"?" selected":""}>Baja</option></select><label class="m">Notas</label><textarea id="co_">${esc(c.notes)}</textarea><button id="ok">Guardar</button>`);
 h.querySelectorAll("input[type=checkbox]").forEach(b=>b.onchange=()=>{h.querySelector("#cx"+b.dataset.i).style.display=b.checked?"":"none"});
 h.querySelector("#ok").onclick=()=>{const g=q=>h.querySelector(q).value.trim(),n=g("#cn_"),dc=g("#cd_").replace(/[.\-\s]/g,"");
  if(!n){alert("Ingresá el nombre del cliente");return}
  if(!/^\d{6,13}$/.test(dc)){alert("Ingresá el documento: solo números, entre 6 y 13 dígitos");return}
  if(D.clients.some(x=>x.doc===dc&&x.id!==id)){alert("Ya existe un cliente con ese documento");return}
  const progs=APN().map((p,i)=>h.querySelector(`[data-i="${i}"]`).checked?{prog:p,code:g("#cx"+i).toUpperCase(),until:(pr(p)||{}).until||""}:null).filter(Boolean);
  if(!progs.length){alert("Elegí al menos una aplicación");return}
  const lost=(c.progs||[]).filter(p=>p.until&&!progs.some(q=>q.prog===p.prog));if(lost.length&&!confirm("Vas a quitar "+lost.map(p=>p.prog).join(", ")+" y se pierde su licencia cargada. ¿Seguir?"))return;
  const x={name:n,biz:g("#cb_"),doc:dc,phone:g("#cp_"),addr:g("#ca_"),city:g("#cc_"),prov:g("#cv_"),progs,sellerId:g("#cs_"),active:g("#ce_"),notes:g("#co_")};
  if(id){if(c.sellerId!==x.sellerId)L(id,"Asignación","Vendedor: "+sn(x.sellerId));Object.assign(c,x)}else{x.id=uid();D.clients.push(x);L(x.id,"Nota","Cliente dado de alta")}
